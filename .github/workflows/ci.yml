name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentport
          POSTGRES_PASSWORD: agentport
          POSTGRES_DB: agentport
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentport -d agentport"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        # service container 不支持覆盖 command，这里用无密码 Redis 并让测试连它。
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://agentport:agentport@localhost:5432/agentport
      # CI 的 service container 无法带 --requirepass，因此用无密码实例。
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm lint:focus
      - run: pnpm lint:contract
      - run: pnpm openui:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentport
          POSTGRES_PASSWORD: agentport
          POSTGRES_DB: agentport
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentport -d agentport"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://agentport:agentport@localhost:5432/agentport
      REDIS_URL: redis://localhost:6379
      # 固定值即可：只服务本次 job 的一次性数据库。
      APP_SECRET_KEY: ci-app-secret-key-0123456789abcdef
      JWT_SECRET: ci-jwt-secret-key-0123456789abcdef
      ADMIN_USER: admin
      ADMIN_PASSWORD: ci-admin-password
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASSWORD: ci-admin-password
      RATE_LIMIT_DISABLED: '1'
      E2E_WORKER_PAUSED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm exec e2e-web install chromium --with-deps
      # 只启动 API：web 由 e2e 自己拉起（CI 下 reuseExisting 会被拒绝，
      # 预先启动会在 5173 上撞车并报 APP_ALREADY_RUNNING）。
      - name: Start api
        run: |
          pnpm --filter @agentport/api dev > dev.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:3000/health/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/health/ready
      # e2e 是唯一的主套件（Playwright 已退役）。
      - run: pnpm exec e2e run --reporter=list,junit
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            .e2e/results/
            dev.log
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 两个镜像都从 root context 构建；依赖安装与构建在 Dockerfile 内完成。
      - run: docker build -t agentport/api:ci .
      - run: docker build --target sandbox -t agentport/sandbox:ci .
