name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentport
          POSTGRES_PASSWORD: agentport
          POSTGRES_DB: agentport
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentport -d agentport"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        # service container 不支持覆盖 command，这里用无密码 Redis 并让测试连它。
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://agentport:agentport@localhost:5432/agentport
      # CI 的 service container 无法带 --requirepass，因此用无密码实例。
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm test
