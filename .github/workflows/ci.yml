name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: agentport
          POSTGRES_PASSWORD: agentport
          POSTGRES_DB: agentport
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentport -d agentport"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://agentport:agentport@localhost:5432/agentport
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - run: bun install --frozen-lockfile
      - run: bun run biome ci .
      - run: bun run lint:focus
      - run: bun run lint:contract
      # globalSetup 用 docker create --pull=never 启动临时 Redis，只需镜像先在本地。
      # tag 必须与 packages/worker/test/global-setup.ts 的 REDIS_IMAGE 一致。
      - name: Prepare test Redis image
        run: docker pull redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
      - run: bun run openui:check
      - run: bun run typecheck
      - run: bun run build
      - run: bun run db:migrate
      - run: bun run test
      - run: bun run test:web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: agentport
          POSTGRES_PASSWORD: agentport
          POSTGRES_DB: agentport
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentport -d agentport"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://agentport:agentport@localhost:5432/agentport
      REDIS_URL: redis://localhost:6379
      E2E_DATABASE_URL: postgres://agentport:agentport@localhost:5432/agentport
      E2E_REDIS_URL: redis://localhost:6379
      # 固定值即可：只服务本次 job 的一次性数据库。
      APP_SECRET_KEY: ci-app-secret-key-0123456789abcdef
      JWT_SECRET: ci-jwt-secret-key-0123456789abcdef
      ADMIN_USER: admin
      ADMIN_PASSWORD: ci-admin-password
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASSWORD: ci-admin-password
      RATE_LIMIT_DISABLED: '1'
      E2E_WORKER_PAUSED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run db:migrate
      - run: bun run e2e-web install chromium --with-deps
      # 只启动 API：web 由 e2e 自己拉起（CI 下 reuseExisting 会被拒绝，
      # 预先启动会在 5173 上撞车并报 APP_ALREADY_RUNNING）。
      - name: Start api
        run: |
          bun run --filter @agentport/api dev > dev.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:3000/health/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/health/ready
      # e2e 是唯一的主套件（Playwright 已退役）。
      - run: bun run e2e run --reporter=list,junit
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-failure
          path: |
            .e2e/results/
            dev.log
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      # 两个镜像都从 root context 构建；依赖安装与构建在 Dockerfile 内完成。
      - run: docker build -t agentport/api:ci .
      - run: docker build --target sandbox -t agentport/sandbox:ci .
