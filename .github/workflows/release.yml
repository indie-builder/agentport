name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 沙盒镜像的 Dockerfile 只复制 packages/sandbox/dist 与暂存的 shared/。
      - run: pnpm --filter @agentport/sandbox build
      - run: pnpm --filter @agentport/shared build
      - run: rm -rf packages/sandbox/shared && cp -R packages/shared/dist packages/sandbox/shared
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: packages/sandbox
          push: true
          tags: ghcr.io/${{ github.repository }}/sandbox:${{ github.ref_name }}
