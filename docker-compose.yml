name: agentport

# 本地全栈：postgres + redis + migrate（一次性）+ api + worker。
# web 生产由 api 静态托管（WEB_DIST），所以没有独立 web 服务；
# 前端开发仍用 packages/web 的 Vite dev server（pnpm dev）。

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentport
      POSTGRES_PASSWORD: agentport
      POSTGRES_DB: agentport
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentport -d agentport']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # 密码由 compose 在启动时注入；healthcheck 里用同一个变量名，避免两处不一致。
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-agentport-dev}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    image: agentport/api:dev
    # 一次性迁移：使用镜像内已 deploy 的 db 包（含 dist、migrations、scripts）。
    command: ['node', 'api/node_modules/@agentport/db/scripts/migrate.js']
    restart: 'no'
    env_file: .env
    environment:
      DATABASE_URL: postgres://agentport:agentport@postgres:5432/agentport
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: agentport/api:dev
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://agentport:agentport@postgres:5432/agentport
      REDIS_URL: redis://:${REDIS_PASSWORD:-agentport-dev}@redis:6379
      # web 构建产物在镜像里的位置（根 Dockerfile 复制 packages/web/dist 到 /app/web）
      WEB_DIST: /app/web
      # 与 worker 共用工作区卷；api 只负责渲染，不落盘，路径保持一致便于排查。
      WORKSPACES_DIR: /workspaces
    volumes:
      - workspaces:/workspaces
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    image: agentport/api:dev
    restart: unless-stopped
    command: ['node', 'worker/dist/index.js']
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://agentport:agentport@postgres:5432/agentport
      REDIS_URL: redis://:${REDIS_PASSWORD:-agentport-dev}@redis:6379
      # 固定容器内路径，与执行 compose 的目录无关。
      WORKSPACES_DIR: /workspaces
      # 沙盒由宿主 daemon 启动，-v 的源路径按宿主文件系统解析，不能直接用容器内路径。
      # 命名卷在标准 rootful Docker 上的宿主目录如下（项目名固定为 agentport）；
      # rootless / 自定义 data-root 时用 HOST_WORKSPACES_DIR 覆盖。
      HOST_WORKSPACES_DIR: ${HOST_WORKSPACES_DIR:-/var/lib/docker/volumes/agentport_workspaces/_data}
      SANDBOX_IMAGE: agentport/sandbox:dev
      # 沙盒在默认 bridge 上，通过 host.docker.internal 回到宿主发布的 3000 端口。
      SANDBOX_API_URL: http://host.docker.internal:3000
      # 模型代理端口：必须发布到宿主，沙盒（默认 bridge）才能经 host.docker.internal 访问。
      MODEL_PROXY_PORT: ${MODEL_PROXY_PORT:-3426}
    ports:
      # 只绑回环：代理本身用 run token 鉴权，但不该暴露到局域网。
      - '127.0.0.1:${MODEL_PROXY_PORT:-3426}:${MODEL_PROXY_PORT:-3426}'
    volumes:
      # 单机妥协（D-16 已决定：自用保持）：worker 直接控制宿主 Docker，等价宿主 root。
      # 开始处理不受信内容、引入多用户、或与其他服务共用机器时，
      # 换 socket proxy / 独立沙盒节点 / microVM。触发条件见 docs/DECISIONS-PENDING.md D-16。
      - /var/run/docker.sock:/var/run/docker.sock
      - workspaces:/workspaces
    # socket 属于宿主 root:docker；容器内 node 用户不在该组，补上 GID 0
    # （Docker Desktop 默认 socket 为 root:root）。Linux 上若 docker 组 GID 不同，
    # 用 DOCKER_GID 覆盖。
    #
    # 风险（SECURITY.md M14）：能访问该 socket 的进程可以启动特权容器，
    # 因此 worker 容器本身就是宿主 root 的等价物。只在单机自用、只运行自己配置的
    # 智能体时使用；对外提供服务前，替换为 socket proxy（只放行 container 相关 API）
    # 或独立沙盒节点。详见 docs/OPERATIONS.md「Docker socket 风险」。
    group_add:
      - '${DOCKER_GID:-0}'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  workspaces:
