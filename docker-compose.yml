name: agentport

# 本地全栈：postgres + redis + migrate（一次性）+ api + worker。
# web 生产由 api 静态托管（WEB_DIST），所以没有独立 web 服务；
# 前端开发仍用 packages/web 的 Vite dev server（pnpm dev）。

services:
  postgres:
    # 知识库需要 pgvector；该镜像基于 PostgreSQL 18（18.6）并内置 vector 0.8.7。
    # digest 是 registry manifest index（不是 image inspect 的 config Id），
    # 已用 `docker buildx imagetools inspect` 与 Hub manifest 响应核对。
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentport
      POSTGRES_PASSWORD: agentport
      POSTGRES_DB: agentport
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentport -d agentport']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3-alpine@sha256:896f241f438ab6a210cfb24f573b84bea721a4cbe67f1b4fd07eb638b3b02a7b
    restart: unless-stopped
    # 密码由 compose 在启动时注入；healthcheck 里用同一个变量名，避免两处不一致。
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-agentport-dev}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # 命名卷首次创建时属主是 root；api/worker 以 node(1000) 运行会 EACCES。
  # 单独的一次性 init 修复，`docker compose up` 与 up.sh 行为一致。
  init:
    image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    command: ['chown', '-R', '1000:1000', '/w', '/k']
    restart: 'no'
    volumes:
      - workspaces:/w
      - knowledgedata:/k

  migrate:
    build:
      context: .
      target: runtime
    image: ${API_IMAGE:-agentport/api:dev}
    # 一次性迁移：使用镜像内已 deploy 的 db 包（含 dist、migrations、scripts）。
    command: ['node', 'api/node_modules/@agentport/db/scripts/migrate.js']
    restart: 'no'
    env_file: .env
    environment:
      DATABASE_URL: postgres://agentport:agentport@postgres:5432/agentport
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy

  # 复杂格式解析（PDF/Office/OCR）。默认不启动：`docker compose --profile docling up -d docling`。
  # 镜像 index digest 已用 ghcr manifest 核验（v1.38.2，amd64/arm64 均存在）；该版本镜像已预装
  # layout/tableformer/picture_classifier/rapidocr/easyocr 模型，启动不再下载。
  # 不想内置时把 DOCLING_URL 指向外部 Docling，鉴权同样用 DOCLING_TOKEN（X-Api-Key）。
  docling:
    profiles: ['docling']
    image: ghcr.io/docling-project/docling-serve-cpu:v1.38.2@sha256:7a480a1604fa3b42efeddc7db9527690d9f9bc903226136013e2bfe6b1a4dfb0
    restart: unless-stopped
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_TOKEN:-}
      # 默认同步只等 120s；对齐客户端 10 分钟上限，否则大文件在服务端先 504。
      DOCLING_SERVE_MAX_SYNC_WAIT: '600'
    ports:
      - '127.0.0.1:5001:5001'

  api:
    build:
      context: .
      target: runtime
    image: ${API_IMAGE:-agentport/api:dev}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://agentport:agentport@postgres:5432/agentport
      REDIS_URL: redis://:${REDIS_PASSWORD:-agentport-dev}@redis:6379
      # web 构建产物在镜像里的位置（根 Dockerfile 复制 packages/web/dist 到 /app/web）
      WEB_DIST: /app/web
      WORKSPACES_DIR: /workspaces
      # 知识库原件与解析产物；api 负责写入上传，worker 读取处理，两者必须同卷。
      KNOWLEDGE_DIR: /knowledge
      KNOWLEDGE_PRIVATE_HOST_ALLOWLIST: ${KNOWLEDGE_PRIVATE_HOST_ALLOWLIST:-}
      # .env 里 development/debug 只用于本地进程；容器部署默认 info，需要时显式 export。
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3000:3000'
    volumes:
      - workspaces:/workspaces
      - knowledgedata:/knowledge
    # 供 `docker compose up --wait` 与依赖服务判断就绪，不只看进程是否启动。
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: runtime
    image: ${API_IMAGE:-agentport/api:dev}
    restart: unless-stopped
    stop_grace_period: 30s
    command: ['node', 'worker/dist/index.js']
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://agentport:agentport@postgres:5432/agentport
      REDIS_URL: redis://:${REDIS_PASSWORD:-agentport-dev}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 固定容器内路径，与执行 compose 的目录无关。
      WORKSPACES_DIR: /workspaces
      KNOWLEDGE_DIR: /knowledge
      # 解析服务（Docling）与 Wiki 模型；未配置时知识功能明确不可用，不静默降级。
      DOCLING_URL: ${DOCLING_URL:-}
      DOCLING_TOKEN: ${DOCLING_TOKEN:-}
      KNOWLEDGE_WIKI_MODEL: ${KNOWLEDGE_WIKI_MODEL:-}
      KNOWLEDGE_PRIVATE_HOST_ALLOWLIST: ${KNOWLEDGE_PRIVATE_HOST_ALLOWLIST:-}
      # 沙盒由宿主 daemon 启动，-v 的源路径按宿主文件系统解析，不能直接用容器内路径。
      # 命名卷在标准 rootful Docker 上的宿主目录如下（项目名固定为 agentport）；
      # rootless / 自定义 data-root 时用 HOST_WORKSPACES_DIR 覆盖。
      HOST_WORKSPACES_DIR: ${HOST_WORKSPACES_DIR:-/var/lib/docker/volumes/agentport_workspaces/_data}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-agentport/sandbox:dev}
      # 沙盒在默认 bridge 上，通过 host.docker.internal 回到宿主发布的 3000 端口。
      SANDBOX_API_URL: http://host.docker.internal:3000
      # 模型代理端口：必须发布到宿主，沙盒（默认 bridge）才能经 host.docker.internal 访问。
      MODEL_PROXY_PORT: ${MODEL_PROXY_PORT:-3426}
    ports:
      # 只绑回环：代理本身用 run token 鉴权，但不该暴露到局域网。
      - '127.0.0.1:${MODEL_PROXY_PORT:-3426}:${MODEL_PROXY_PORT:-3426}'
    volumes:
      # 单机妥协（D-16 已决定：自用保持）：worker 直接控制宿主 Docker，等价宿主 root。
      # 开始处理不受信内容、引入多用户、或与其他服务共用机器时，
      # 换 socket proxy / 独立沙盒节点 / microVM。触发条件见 docs/DECISIONS-PENDING.md D-16。
      - /var/run/docker.sock:/var/run/docker.sock
      - workspaces:/workspaces
      - knowledgedata:/knowledge
    # socket 属于宿主 root:docker；容器内 node 用户不在该组，补上 GID 0
    # （Docker Desktop 默认 socket 为 root:root）。Linux 上若 docker 组 GID 不同，
    # 用 DOCKER_GID 覆盖。
    #
    # 风险（SECURITY.md M14）：能访问该 socket 的进程可以启动特权容器，
    # 因此 worker 容器本身就是宿主 root 的等价物。只在单机自用、只运行自己配置的
    # 智能体时使用；对外提供服务前，替换为 socket proxy（只放行 container 相关 API）
    # 或独立沙盒节点。详见 docs/OPERATIONS.md「Docker socket 风险」。
    group_add:
      - '${DOCKER_GID:-0}'
    depends_on:
      init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  workspaces:
  knowledgedata:
